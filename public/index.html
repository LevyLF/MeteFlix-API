<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> MeteFlix - Filmes e Séries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="CineFlix Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><i class="fas fa-film" style="display:none;"></i>
      <h1>MeteFlix</h1>
    </div>
    <nav>
      <button id="btn-login" class="btn btn-secondary">Login</button>
      <button id="btn-register" class="btn btn-primary">Registrar</button>
      <button id="btn-logout" class="btn btn-secondary" style="display:none;">Logout</button>
    </nav>
  </header>
  
  <main>
    <div class="tabs">
      <button class="tab-button active" data-tab="todos"><i class="fas fa-home"></i> Explorar</button>
      <button class="tab-button" data-tab="pesquisar"><i class="fas fa-search"></i> Pesquisar</button>
      <button class="tab-button" data-tab="adicionar" id="tab-add" style="display:none;"><i class="fas fa-plus"></i> Adicionar</button>
    </div>
    
    <div id="tab-todos" class="tab-content active">
      <section class="items-grid" id="itens-todos"></section>
    </div>
    
    <div id="tab-pesquisar" class="tab-content">
      <section class="search-section">
        <h2><i class="fas fa-search"></i> Pesquisa Avançada</h2>
        <form id="form-busca" class="form-card">
          <input type="text" id="busca-titulo" placeholder="Título">
          <input type="text" id="busca-genero" placeholder="Gênero">
          <input type="number" id="busca-ano" placeholder="Ano">
          <button type="submit" class="btn btn-primary">Buscar</button>
          <button type="button" id="btn-limpar-busca" class="btn btn-secondary">Limpar</button>
        </form>
        <section class="items-grid" id="itens-pesquisa"></section>
      </section>
    </div>
    
    <div id="tab-adicionar" class="tab-content">
      <section class="add-section">
        <h2><i class="fas fa-plus"></i> Adicionar Novo Item</h2>
        <form id="form-item" class="form-card" enctype="multipart/form-data">
          <input type="text" id="titulo" placeholder="Título" required>
          <input type="file" id="capa" accept="image/*">
          <select id="tipo">
            <option value="filme">Filme</option>
            <option value="serie">Série</option>
          </select>
          <input type="number" id="ano" placeholder="Ano" required>
          <input type="text" id="genero" placeholder="Gênero" required>
          <textarea id="descricao" placeholder="Descrição"></textarea>
          <button type="submit" class="btn btn-primary">Adicionar</button>
        </form>
      </section>
    </div>
  </main>
  
  <!-- Modais para Auth -->
  <div id="modal-login" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Login</h2>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Senha" required>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </div>
  </div>
  
  <div id="modal-register" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registrar</h2>
      <form id="form-register">
        <input type="text" id="reg-username" placeholder="Usuário" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Senha" required>
        <button type="submit" class="btn btn-primary">Registrar</button>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
